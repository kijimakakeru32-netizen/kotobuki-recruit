# Netlify 設定ファイル（触らなくてOKです）
[build]
  # ビルド不要の静的サイトなので、このフォルダをそのまま公開します
  publish = "."
  command = ""

# 画像・CSS・JSのキャッシュ設定
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# config.js・main.js は更新のたび即反映させたいのでキャッシュしない
# （must-revalidate により、毎回サーバーに最新か確認してから表示します）
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 存在しないURLはトップページへ
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 404
